<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BOYS予想部</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{ --pink:#E6187E; --pink-d:#AD1263; --pink-s:#FDE6F1; --gray:#595757; --cream:#FFF8FB; --gold:#E8B94A; --gold-s:#FFF6DC; --line:#E2DDCF; --ink:#4A4A4A; --soft:#9B9B9B; --navy:#1A1A1A; --navy-s:#F3ECD6; --g:#F2B705; --black:#1A1A1A; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:'Noto Sans JP',sans-serif;color:var(--ink);background:#F4F1EA;min-height:100vh;}
  .app{max-width:520px;margin:0 auto;padding:14px 12px 60px;}
  h1,h3,.r{font-family:'M PLUS Rounded 1c',sans-serif;}
  .head{text-align:center;}
  .head img{height:62px;}
  .head h1{margin:6px 0 0;font-size:27px;font-weight:800;color:var(--g);letter-spacing:.08em;background:var(--black);border-radius:16px;padding:10px 8px;}
  .head h1 span{color:#fff;}
  .head .sub{font-size:12.5px;color:#555;margin-top:6px;font-weight:700;}
  .monthbar{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0;}
  .monthbar button{border:none;background:var(--black);width:34px;height:34px;border-radius:50%;color:var(--g);font-size:15px;cursor:pointer;}
  .monthbar button:disabled{opacity:.3;}
  .monthbar .m{font-family:'M PLUS Rounded 1c';font-weight:800;font-size:18px;min-width:120px;text-align:center;}
  .card{background:#fff;border-radius:18px;border:1.5px solid #D9D3C3;padding:14px;margin-bottom:12px;}
  .card h3{margin:0 0 10px;font-size:15.5px;color:var(--black);border-left:5px solid var(--g);padding-left:8px;}
  .crown{background:var(--black);border:2px solid var(--g);text-align:center;}
  .crown .l{font-size:12.5px;font-weight:800;color:var(--g);}
  .crown .n{font-family:'M PLUS Rounded 1c';font-weight:800;font-size:28px;color:#fff;margin:2px 0;}
  .crown .p{font-size:15px;font-weight:800;color:var(--g);}
  .crown .b{font-size:12px;color:#E8E2CF;margin-top:4px;}
  .phase{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .badge{padding:5px 12px;border-radius:999px;font-size:13px;font-weight:800;font-family:'M PLUS Rounded 1c';white-space:nowrap;}
  .b-open{background:#13883E;color:#fff;} .b-closed{background:var(--g);color:var(--black);} .b-ended{background:var(--pink);color:#fff;} .b-before{background:#888;color:#fff;}
  .phase .t{font-size:12.5px;color:var(--soft);text-align:right;}
  .phase .t b{color:var(--ink);font-size:14.5px;}
  label.f{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin:12px 0 5px;}
  input[type=text],input[type=password],input[type=number],select{width:100%;padding:11px 12px;font-size:16px;border:1.5px solid var(--line);border-radius:11px;background:#FDFAF7;font-family:'Noto Sans JP';color:var(--ink);}
  .btn{border:none;border-radius:13px;padding:11px 14px;font-size:15px;font-weight:800;cursor:pointer;font-family:'Noto Sans JP';}
  .btn.main{background:var(--black);color:var(--g);}
  .btn.pink{background:var(--g);color:var(--black);font-size:16px;}
  .btn.sub{background:#E8E2CF;color:var(--black);}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--soft);font-size:12.5px;padding:6px 10px;}
  .btn.block{width:100%;}
  .btn.allin{background:#fff;border:1.5px solid var(--black);color:var(--black);border-radius:999px;padding:7px 14px;font-size:13px;white-space:nowrap;}
  .btn:disabled{opacity:.4;box-shadow:none;}
  .seg{display:flex;background:#E8E2CF;border-radius:12px;padding:4px;gap:4px;}
  .seg button{flex:1;border:none;background:transparent;border-radius:9px;padding:9px 2px;font-size:13.5px;font-weight:800;color:var(--navy);cursor:pointer;}
  .seg button.on{background:var(--black);color:var(--g);}
  .pickrow{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .pickrow .no{flex:0 0 42px;font-family:'M PLUS Rounded 1c';font-weight:800;color:var(--navy);}
  .stepper{display:flex;align-items:center;gap:12px;}
  .stepper button:not(.allin){width:44px;height:44px;border-radius:50%;border:none;background:var(--black);color:var(--g);font-size:22px;font-weight:800;cursor:pointer;}
  .stepper .u{font-family:'M PLUS Rounded 1c';font-weight:800;font-size:26px;min-width:60px;text-align:center;}
  .wallet{display:flex;gap:8px;}
  .wallet div{flex:1;background:var(--black);border-radius:12px;padding:8px;text-align:center;}
  .wallet .l{font-size:11.5px;color:#fff;font-weight:700;}
  .wallet .v{font-family:'M PLUS Rounded 1c';font-weight:800;font-size:24px;color:var(--g);}
  .tk{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .tk .ty{flex:0 0 auto;font-size:11px;font-weight:800;padding:3px 7px;border-radius:7px;background:var(--black);color:#fff;}
  .tk .ty.san{background:var(--g);color:var(--black);} .tk .ty.mankin{background:var(--pink);color:#fff;}
  .tk .mid{flex:1;min-width:0;} .tk .who{font-weight:800;} .tk .pk{word-break:break-all;}
  .tk .pt{font-weight:800;white-space:nowrap;text-align:right;}
  .tk .pay{color:#13883E;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{font-size:11.5px;color:var(--soft);font-weight:500;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);}
  td{padding:7px 6px;border-bottom:1px dashed var(--line);}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;}
  .odds{font-family:'M PLUS Rounded 1c';font-weight:800;color:var(--navy);}
  .top1 td{background:var(--g);color:var(--black);font-weight:800;}
  .result{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .result div{border:2px solid var(--line);border-radius:12px;padding:6px 10px;text-align:center;min-width:76px;}
  .result div{border-color:var(--black)!important;} .result div.mk{background:var(--pink);color:#fff;} .result div.mk small{color:#fff;}
  .result small{display:block;font-size:10.5px;color:var(--soft);font-weight:700;}
  .result b{font-family:'M PLUS Rounded 1c';font-size:15px;}
  .muted{font-size:12.5px;color:var(--soft);}
  .empty{text-align:center;color:var(--soft);font-size:13px;padding:12px 0;}
  .rules .rh{background:var(--black);color:var(--g);border-radius:8px;padding:4px 10px;font-weight:800;font-size:13px;margin:10px 0 4px;}
  .rules .rh:first-of-type{margin-top:0;}
  .rules .rb{font-size:13px;line-height:1.75;}
  .note{background:#FFF3C4;border-radius:12px;padding:10px 12px;font-size:13px;color:#7A5A00;margin-bottom:10px;}
  .mrow{display:grid;grid-template-columns:1fr 84px 58px 30px;gap:6px;align-items:center;margin-bottom:6px;font-size:12px;}
  .mrow input{padding:8px;font-size:15px;}
  .mrow label{display:flex;align-items:center;gap:3px;justify-content:center;}
  .foot{text-align:center;margin-top:18px;font-size:12px;} .foot a{color:var(--soft);}
  .overlay{position:fixed;inset:0;background:rgba(20,25,45,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .dlg{background:#fff;border-radius:18px;padding:18px 16px;max-width:380px;width:100%;}
  .dlg .m{font-weight:700;line-height:1.7;white-space:pre-line;text-align:center;margin-bottom:14px;}
  .dlg .bs{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:999px;font-size:13.5px;z-index:60;max-width:90%;text-align:center;}
  .loading{text-align:center;color:var(--soft);padding:40px 0;}
</style>
</head>

/* ---------- 通信 ---------- */
function getJson(url, params){
  return fetch(url + '?' + new URLSearchParams(params).toString()).then(function(r){ return r.json(); }).then(function(d){ if (d && d.error) throw new Error(d.error); return d; });
}
function post(data){
  return fetch(BOYS_GAS_URL, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(data)})
    .then(function(r){ return r.json(); }).then(function(d){ if (d && d.error) throw new Error(d.error); return d; });
}

/* ---------- 日付 ---------- */
function businessDate(){ var d = new Date(); if (d.getHours() < 6) d.setDate(d.getDate() - 1); return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }
function shiftMonth(mk, n){ var a = mk.split('-').map(Number), y = a[0], m = a[1] + n; while (m < 1){ m += 12; y--; } while (m > 12){ m -= 12; y++; } return y + '-' + ('0'+m).slice(-2); }
function mLabel(mk){ var a = mk.split('-'); return a[0] + '年' + Number(a[1]) + '月'; }
function mOf(mk){ return Number(mk.split('-')[1]); }

/* ---------- ランキングの計算（ランキング画面と同じ決め方） ---------- */
var DEFAULT_RULE = {first:3, second:1, third:-1, tobi:1, yakuman:0, mankin:0};
function ruleFor(mk){ var a = null; (S.pointRules||[]).forEach(function(r){ if (r.from <= mk && (!a || r.from > a.from)) a = r; }); return Object.assign({}, DEFAULT_RULE, a || {}); }
function stats(pid, rec, rule){
  var f=0,s=0,t=0,tb=0,y=0; var days = rec[pid] || {};
  Object.keys(days).forEach(function(k){ var d = days[k]; f+=d.first||0; s+=d.second||0; t+=d.third||0; tb+=d.tobi||0; y+=d.yakuman||0; });
  return {games: f+s+t, yakuman: y, points: f*rule.first + s*rule.second + t*rule.third + tb*rule.tobi + y*(rule.yakuman||0)};
}
function mankinOf(mk, rec){
  var rule = ruleFor(mk);
  var all = S.players.map(function(p){ return Object.assign({}, p, stats(p.id, rec, rule)); }).filter(function(p){ return p.games > 0; });
  var maxY = Math.max.apply(null, [0].concat(all.map(function(p){ return p.yakuman; })));
  return {max: maxY, players: maxY > 0 ? all.filter(function(p){ return p.yakuman === maxY; }) : []};
}
function rankingOf(mk, rec){
  var rule = ruleFor(mk), mp = Number(rule.mankin) || 0, mk2 = mankinOf(mk, rec);
  var ids = {}; if (mp > 0) mk2.players.forEach(function(p){ ids[p.id] = 1; });
  var boys = (S.boyMonths||[]).indexOf(mk) >= 0;
  return S.players.filter(function(p){ return !p.excluded; }).map(function(p){
    var st = Object.assign({}, p, stats(p.id, rec, rule)); if (ids[p.id]) st.points += mp; return st;
  }).filter(function(p){ return p.games > 0; }).sort(function(a,b){ return b.points - a.points || b.games - a.games; })
    .filter(function(p){ return boys || !p.boy; });
}
function candidates(type, mk){
  if (type === 'mankin') return S.players.slice();
  var boys = (S.boyMonths||[]).indexOf(mk) >= 0;
  return S.players.filter(function(p){ return !p.excluded && (boys || !p.boy); });
}
var nameOf = function(id){ var p = S.players.filter(function(x){ return x.id === id; })[0]; return p ? p.jan : '？'; };
function f1(v){ return (Math.floor(v * 10 + 1e-9) / 10).toFixed(1).replace(/\.0$/, ''); }

/* ---------- 結果の計算（取り分0%、同着は山分け、当たりなしはポイントなし） ---------- */
function settle(bets, rk, mk){
  var win = {tan: rk[0] ? [rk[0].id] : [], san: rk.length >= 3 ? [rk.slice(0,3).map(function(p){ return p.id; }).join('-')] : [], mankin: mk.players.map(function(p){ return p.id; })};
  var pay = {};
  ['tan','san','mankin'].forEach(function(t){
    var bs = bets.filter(function(b){ return b.type === t; });
    var total = bs.reduce(function(s,b){ return s + b.points; }, 0);
    var stake = {}; bs.forEach(function(b){ stake[b.picks] = (stake[b.picks]||0) + b.points; });
    var hit = win[t].filter(function(k){ return stake[k] > 0; });
    bs.forEach(function(b){ pay[b.id] = hit.indexOf(b.picks) >= 0 ? Math.floor(b.points / stake[b.picks] * (total / hit.length) * 10 + 1e-9) / 10 : 0; });
  });
  var board = {};
  bets.forEach(function(b){ var x = board[b.name] || (board[b.name] = {name: b.name, spent: 0, got: 0}); x.spent += b.points; x.got += pay[b.id]; });
  var list = Object.keys(board).map(function(n){ var x = board[n]; x.final = Math.round((S.data.startPoints - x.spent + x.got) * 10) / 10; return x; })
    .sort(function(a,b){ return b.final - a.final; });
  var best = list.length ? list[0].final : null;
  var winners = list.filter(function(x){ return x.final === best; });
  var each = winners.length ? Math.floor(BONUS_YEN / winners.length) : 0;
  var bonus = winners.map(function(w){ var m = S.data.members.filter(function(x){ return x.name === w.name; })[0]; return {name: w.name, yen: m && m.noBonus ? 0 : each, honor: !!(m && m.noBonus)}; });
  return {win: win, pay: pay, list: list, winners: winners, bonus: bonus, each: each};
}

  h += '<div class="card"><h3>📅 ' + mOf(S.month) + '月の締め切り</h3><div class="muted">いつもは15日。お試しの月などは変えられるよ（その日の営業終了まで）</div><div style="display:flex;gap:8px;margin-top:8px"><input id="dlday" type="number" min="1" max="31" value="' + dl + '"><button class="btn main" data-a="dlsave" style="white-space:nowrap">日にする</button></div></div>';
  if (d.phase === 'ended' && d.bets){
    var res = settle(d.bets, rankingOf(S.month, S.rec), mankinOf(S.month, S.rec));
    h += '<div class="card"><h3>🏆 ' + mOf(S.month) + '月の結果を確定</h3><div class="muted">ランキングの成績を全部入れ終わってから押してね。歴代のポイントゲッターに残ります。</div><div style="margin:8px 0;font-weight:800">' + (res.winners.length ? res.winners.map(function(w){ return esc(w.name); }).join('・') + '（' + f1(res.winners[0].final) + 'P）' : '優勝なし') + '</div><button class="btn pink block" data-a="hall">この結果で確定する</button></div>';
  }
  return h + '<div class="foot"><a href="#" data-a="back">もどる</a></div>';
}

/* ---------- 操作 ---------- */
function bind(){
  root.querySelectorAll('[data-a]').forEach(function(el){ el.onclick = function(ev){ ev.preventDefault(); onAct(el.getAttribute('data-a')); }; });
  root.querySelectorAll('[data-type]').forEach(function(el){ el.onclick = function(){ S.form.type = el.getAttribute('data-type'); S.form.picks = ['','','']; render(); }; });
  root.querySelectorAll('[data-pick]').forEach(function(el){ el.onchange = function(){ S.form.picks[+el.getAttribute('data-pick')] = el.value; render(); }; });
  root.querySelectorAll('[data-cancel]').forEach(function(el){ el.onclick = function(){
    var b = S.myBets.filter(function(x){ return x.id === el.getAttribute('data-cancel'); })[0];
    ask(TYPE_NAME[b.type] + '「' + b.pickNames + '」' + b.points + 'Pのうさ券を取り消す？', function(){ act(function(){ return post({action: 'cancelBet', name: S.me, pin: S.pin, id: b.id}).then(function(){ toast('取り消しました'); return load(); }); }); });
  }; });
  root.querySelectorAll('[data-mdel]').forEach(function(el){ el.onclick = function(){ keepMembers(); S.admin.members.splice(+el.getAttribute('data-mdel'), 1); render(); }; });
}
function keepMembers(){
  if (!S.admin) return;
  S.admin.members.forEach(function(m, i){
    var n = root.querySelector('[data-mn="' + i + '"]'), p = root.querySelector('[data-mp="' + i + '"]'), b = root.querySelector('[data-mb="' + i + '"]');
    if (n) m.name = n.value.trim(); if (p) m.pin = p.value.trim(); if (b) m.noBonus = b.checked;
  });
}
function onAct(a){
  var f = S.form, used = S.myBets.reduce(function(s,b){ return s + b.points; }, 0), left = (S.data ? S.data.startPoints : 10) - used;
  if (a === 'prev'){ S.month = shiftMonth(S.month, -1); load(); }
  if (a === 'next'){ S.month = shiftMonth(S.month, 1); load(); }
  if (a === 'reload') load();
  if (a === 'logout'){ logout(); render(); }
  if (a === 'login') act(function(){
    var n = document.getElementById('lname').value, p = document.getElementById('lpin').value;
    if (!n || !p){ toast('名前と番号を入れてね'); return; }
    return post({action: 'login', month: S.month, name: n, pin: p}).then(function(d){
      S.me = d.name; S.pin = p; S.myBets = d.bets; try{ sessionStorage.setItem('boys-yoso-me', JSON.stringify({name: S.me, pin: p})); }catch(e){}
      toast('ようこそ、' + S.me + '！'); render();
    });
  });
  if (a === 'minus'){ f.points = Math.max(1, f.points - 1); render(); }
  if (a === 'plus'){ f.points = Math.min(left, f.points + 1); render(); }
  if (a === 'all'){ f.points = Math.max(1, left); render(); }
  if (a === 'buy'){
    var cnt = f.type === 'san' ? 3 : 1, picks = f.picks.slice(0, cnt), names = picks.map(nameOf);
    ask(TYPE_NAME[f.type] + '「' + names.join('→') + '」に' + f.points + 'P賭ける？', function(){ act(function(){
      return post({action: 'addBet', month: S.month, name: S.me, pin: S.pin, type: f.type, picks: picks, pickNames: names, points: f.points}).then(function(){
        S.form = {type: f.type, picks: ['','',''], points: 1}; toast('うさ券を買ったよ！ 結果は月末に🎉'); return load();
      });
    }); });
  }
  if (a === 'admin'){ S.view = 'admin'; render(); }
  if (a === 'back'){ S.view = 'main'; S.admin = null; render(); }
  if (a === 'aunlock') act(function(){
    var p = document.getElementById('apin').value;
    return post({action: 'adminGet', adminPin: p}).then(function(d){ S.adminPin = p; S.admin = d; if (!S.admin.members.length) S.admin.members.push({name: '', pin: '', noBonus: false}); render(); });
  });
  if (a === 'madd'){ keepMembers(); S.admin.members.push({name: '', pin: '', noBonus: false}); render(); }
  if (a === 'msave') act(function(){ keepMembers(); return post({action: 'setMembers', adminPin: S.adminPin, members: S.admin.members}).then(function(){ toast('部員を保存しました'); return load().then(function(){ S.view = 'admin'; render(); }); }); });
  if (a === 'dlsave') act(function(){ var day = Number(document.getElementById('dlday').value); return post({action: 'setDeadline', adminPin: S.adminPin, month: S.month, day: day}).then(function(){ S.admin.deadlines[S.month] = day; toast(mOf(S.month) + '月の締め切りを' + day + '日にしました'); return load().then(function(){ S.view = 'admin'; render(); }); }); });
  if (a === 'hall'){
    var res = settle(S.data.bets, rankingOf(S.month, S.rec), mankinOf(S.month, S.rec));
    ask('この結果で確定する？', function(){ act(function(){ return post({action: 'setHall', adminPin: S.adminPin, month: S.month, winners: res.winners.map(function(w){ return w.name; }), points: res.winners.length ? res.winners[0].final : null, bonus: res.bonus}).then(function(){ toast('確定しました！'); return load().then(function(){ S.view = 'admin'; render(); }); }); }); });
  }
}
load();
</script>
